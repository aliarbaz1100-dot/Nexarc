<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e50914"><meta name="color-scheme" content="dark"><title>All Games A-Z — NEXARC</title><meta name="description" content="Browse all 120 NEXARC browser games in one fast A-Z library. Find action, racing, sports, puzzle, arcade, zombie and adventure games instantly."><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://nexarc-rouge.vercel.app/all-games.html"><link rel="sitemap" type="application/xml" href="/sitemap.xml"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icon.svg"><link rel="manifest" href="manifest.webmanifest?v=20260912-20664premium10"><link rel="stylesheet" href="legal.css?v=20260912-20664premium10"><style>.azTools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.azTools a,.azSearch{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#fff;border-radius:999px;padding:10px 13px;text-decoration:none;font-weight:900}.azSearch{width:min(520px,100%);border-radius:16px;font-size:15px}.gameList{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:18px}.gameItem{border:1px solid rgba(255,255,255,.1);border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));padding:14px;min-height:116px;box-shadow:0 18px 42px rgba(0,0,0,.22)}.gameItem b{display:block;color:#fff}.gameItem small{display:block;color:#aaa;margin:7px 0 12px}.gameItem a{display:inline-block;background:#e50914;color:white;border-radius:999px;padding:8px 11px;text-decoration:none;font-weight:950;font-size:12px}.azEmpty{color:#aaa;margin-top:12px}.letter{margin-top:26px;color:#fff;font-size:22px}</style></head><body><main class="legalPage"><a class="brand" href="/"><b>NEXARC</b><small>PLAY MORE. EVERYWHERE.</small></a><section class="legalHero"><span>FULL LIBRARY</span><h1>All NEXARC Games A-Z</h1><p>Browse the full 120-game library from one page. Search, filter by first letter, then open any title instantly on NEXARC.</p></section><input id="azSearch" class="azSearch" type="search" placeholder="Search all games…" autocomplete="off" aria-label="Search all NEXARC games"><div id="azLetters" class="azTools" aria-label="A-Z filters"></div><section id="azList" aria-live="polite"><p class="azEmpty">Loading game library…</p></section><p><a href="/">Back to NEXARC</a> · <a href="/categories.html">Categories</a> · <a href="/trending.html">Trending</a></p></main><script>const list=document.querySelector('#azList'),input=document.querySelector('#azSearch'),letters=document.querySelector('#azLetters');let games=[],active='all';const norm=s=>String(s||'').trim();function renderLetters(){const set=[...new Set(games.map(g=>norm(g.title)[0]?.toUpperCase()).filter(Boolean))].sort();letters.innerHTML='<a href="#" data-l="all">All</a>'+set.map(l=>`<a href="#" data-l="${l}">${l}</a>`).join('')}function render(){const q=input.value.toLowerCase().trim();const filtered=games.filter(g=>{const t=norm(g.title);return(!q||t.toLowerCase().includes(q)||norm(g.category).toLowerCase().includes(q))&&(active==='all'||t[0]?.toUpperCase()===active)});if(!filtered.length){list.innerHTML='<p class="azEmpty">No games found.</p>';return}let last='';list.innerHTML=filtered.map(g=>{const l=norm(g.title)[0]?.toUpperCase()||'#';const head=l!==last?`<h2 class="letter">${last=l}</h2>`:'';const url='/?q='+encodeURIComponent(g.title)+'#games';return head+`<article class="gameItem"><b>${g.title}</b><small>${g.category||'Browser game'} · Instant play</small><a href="${url}">Open Game</a></article>`}).join('')}letters.addEventListener('click',e=>{const a=e.target.closest('a[data-l]');if(!a)return;e.preventDefault();active=a.dataset.l;render()});input.addEventListener('input',render);fetch('/games.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{games=Array.isArray(data.games)?data.games:data;games=games.filter(g=>g&&g.title).sort((a,b)=>a.title.localeCompare(b.title));renderLetters();render()}).catch(()=>list.innerHTML='<p class="azEmpty">Game library could not load. Please refresh.</p>');</script></body></html>
