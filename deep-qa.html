<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e50914">
  <meta name="robots" content="noindex,nofollow">
  <title>NEXARC Heavy Catalog QA</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="legal.css?v=20260914-heavy20">
  <style>
    .qaTop{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
    .qaStat,.gameRow{padding:16px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(255,255,255,.035)}
    .qaStat b{display:block;font-size:26px;margin-top:6px}.qaStat span,.meta{opacity:.72;font-size:13px}
    .gameRow{margin:10px 0}.gameHead{display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{font-size:11px;padding:5px 8px;border-radius:999px;border:1px solid rgba(105,227,138,.35)}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions a{padding:7px 10px;border-radius:9px;border:1px solid rgba(255,255,255,.14);text-decoration:none;font-size:12px}
    @media(max-width:720px){.qaTop{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body>
<main class="legalWrap">
 <a class="back" href="/status.html">← Back to Status</a>
 <section class="legalHero"><span>INTERNAL QA</span><h1>Heavy Catalog QA</h1><p>20 active games only. Source, license, performance target and device support are shown below.</p></section>
 <section id="summary" class="qaTop"></section>
 <section id="games"></section>
</main>
<script>
fetch('/games.json?qa=heavy20',{cache:'no-store'}).then(r=>r.json()).then(d=>{
 const games=d.games||[],hosted=games.filter(g=>g.hosted).length,mobile=games.filter(g=>g.mobileReady!==false).length,adfree=games.filter(g=>g.adFree===true).length;
 document.getElementById('summary').innerHTML=
 '<div class="qaStat"><span>Active games</span><b>'+games.length+'</b></div>'+
 '<div class="qaStat"><span>Ad-free</span><b>'+adfree+'</b></div>'+
 '<div class="qaStat"><span>Self-hosted</span><b>'+hosted+'</b></div>'+
 '<div class="qaStat"><span>Mobile-ready</span><b>'+mobile+'</b></div>';
 document.getElementById('games').innerHTML=games.map((g,i)=>{
  const live='/index.html?qaGame='+encodeURIComponent(g.id)+'#play-'+encodeURIComponent(g.id);
  return '<section class="gameRow"><div class="gameHead"><div><strong>#'+(i+1)+' · '+g.title+'</strong><div class="meta">'+g.category+' · '+(g.performance||'Browser game')+' · '+(g.mobileReady===false?'Desktop-first':'Desktop + Mobile')+'</div></div><span class="badge">'+(g.adFree?'AD-FREE':'CHECK')+'</span></div><div class="meta">Source: '+(g.source||'—')+' · License: '+(g.license||'—')+' · QA: '+(g.qaStatus||'pending')+'</div><div class="actions"><a href="'+live+'" target="_blank" rel="noopener">Open in NEXARC</a><a href="'+g.embedUrl+'" target="_blank" rel="noopener">Open source demo</a></div></section>';
 }).join('');
}).catch(()=>{document.getElementById('games').innerHTML='<section class="legalCard"><p>Catalog data could not be loaded.</p></section>'});
</script>
</body></html>
