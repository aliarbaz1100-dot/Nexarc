<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>NEXARC Heavy 20 Self Check</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="legal.css?v=20260914-heavy20">
</head>
<body>
<main class="legalWrap">
  <a class="back" href="/status.html">← Back to Status</a>
  <section class="legalHero">
    <span>INTERNAL QA</span>
    <h1>Heavy 20 Self Check</h1>
    <p>Verifies the ad-free catalog structure and critical NEXARC player integration.</p>
  </section>
  <section class="legalCard"><h2>Checks</h2><ul id="checks"><li>Running checks…</li></ul></section>
</main>
<script>
(async()=>{
 const out=document.getElementById('checks'),rows=[],add=(name,ok,detail)=>rows.push({name,ok,detail});
 try{
  const r=await fetch('/games.json?selfcheck=heavy20',{cache:'no-store'});
  const d=await r.json(),games=d.games||[],ids=games.map(g=>g.id),urls=games.map(g=>g.embedUrl);
  const uniq=a=>new Set(a).size===a.length;
  add('Catalog count',games.length===20,games.length+'/20');
  add('Unique game IDs',uniq(ids),new Set(ids).size+'/'+ids.length);
  add('Unique game URLs',uniq(urls),new Set(urls).size+'/'+urls.length);
  add('Heavy tier only',games.every(g=>g.tier==='heavy'),games.filter(g=>g.tier==='heavy').length+'/20');
  add('Ad-free flag',games.every(g=>g.adFree===true),games.filter(g=>g.adFree===true).length+'/20');
  add('No GameMonetize URLs',games.every(g=>!/gamemonetize/i.test(g.embedUrl||'')),'active catalog');
  add('Secure delivery',games.every(g=>g.hosted===true||/^https:\/\//.test(g.embedUrl||'')),'HTTPS or same-origin');
  add('Source metadata',games.every(g=>g.source&&g.sourceRepo),games.filter(g=>g.source&&g.sourceRepo).length+'/20');
 }catch(e){add('games.json fetch',false,String(e&&e.message||e));}
 try{
  const r=await fetch('/index.html?selfcheck=heavy20',{cache:'no-store'}),html=await r.text();
  add('Player shell',/id=["']player["']/.test(html),'#player');
  add('Game iframe',/id=["']gameFrame["']/.test(html),'#gameFrame');
  add('Fullscreen enabled',/allowfullscreen/.test(html),'iframe');
  add('Retry control',/id=["']retry["']/.test(html),'#retry');
  add('Close control',/id=["']close["']/.test(html),'#close');
  add('No GameMonetize preconnect',!/gamemonetize/i.test(html),'head clean');
 }catch(e){add('index.html fetch',false,String(e&&e.message||e));}
 const ok=rows.filter(x=>x.ok).length;
 out.innerHTML='<li><strong>'+ok+'/'+rows.length+' checks passed</strong></li>'+rows.map(x=>'<li><strong>'+(x.ok?'PASS':'FAIL')+'</strong> — '+x.name+' <small>'+x.detail+'</small></li>').join('');
})();
</script>
</body></html>
